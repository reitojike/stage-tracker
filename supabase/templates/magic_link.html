<h2>stage-tracker へのサインイン</h2>

<p>以下のリンクをクリックするとサインインできます。このリンクの有効期限は限られています。</p>

<p>
  {{ if and .RedirectTo (ne .RedirectTo .SiteURL) }}
  <a href="{{ .RedirectTo }}auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/"
    >サインインする</a
  >
  {{ else }}
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/"
    >サインインする</a
  >
  {{ end }}
</p>

<p>心当たりがない場合は、このメールを無視してください。</p>
