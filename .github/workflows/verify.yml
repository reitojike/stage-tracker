name: Verify

# Deterministic verification floor for this consumer (Issue #1 / PR A;
# extended for Issue #3 / PR B's local Supabase checks; split into
# per-responsibility lanes for Issue #118 so PR Checks show which
# responsibility failed instead of a single collapsed `Verify` result).
# Checks out ai-dev-foundation at a reproducible pinned revision alongside
# this repository so `npm run verify:code` can validate the generated
# adapters and Foundation-managed quality profile against the canonical
# source, not just against files already committed here. `Verify / Database`
# starts a local Supabase stack (via the `supabase` npm devDependency, using
# ubuntu-latest's preinstalled Docker) to run the generated-types drift check
# and the DB/RLS/client-role checks before the Auth build/browser checks
# against a real local Postgres - no remote Supabase project or credentials
# are required.
#
# The full `npm run verify` one-command sequence (code + build + database)
# remains the local/agent deterministic verification contract; these three
# jobs each run one slice of it so failures are attributable per
# responsibility instead of only via the aggregate command's exit code. The
# Database job further separates its DB and Auth groups into named steps while
# keeping one runner, one Supabase stack, and one dependency install.
#
# `Verify / Migration Ordering Fence` (Issue #131) is a fourth, pull_request-
# only job: it also needs no remote Supabase credentials, but is not part of
# the `verify` sequence above (it inspects PR metadata, not local/CI state).
#
# `Verify / Database` uses the same grouped checks as the `verify:database`
# local contract, but with a CI-specific initialization path (Issue #209): it
# skips `supabase db reset` (redundant on this always-fresh runner - see the
# step's own comment below) and excludes Supabase services no Database/RLS/Auth check
# uses (Studio, Realtime, Storage/imgproxy, Edge Runtime,
# Analytics/Logflare/Vector, Supavisor - Mailpit and PostgREST/GoTrue/Kong
# stay, since test/auth's magic-link flow and every RLS/Auth request need
# them) to reduce cold-start image pulls and container registry exposure. The
# DB group runs before the Auth group, and both are called directly from the
# corresponding named steps below so the local aggregate and CI check sets
# remain structurally aligned.
# `postgres-meta` also stays included (Issue #253): the generated-types
# drift check's `supabase gen types --local` needs postgres-meta, and when
# it is excluded from `supabase start`, that command pulls the image itself
# on a fresh runner with no retry - a single Public ECR
# `toomanyrequests: Rate exceeded` there fails the whole job even though no
# actual types/schema drift occurred. `supabase start` already retries
# transient registry pulls for every other image it fetches (observed
# recovering from the same error in CI logs), so keeping postgres-meta in
# the startup set gets it that same retry coverage and leaves it cached
# locally by the time type generation runs, instead of a bare uncached pull
# at that later, unretried point.

on:
  push:
    branches: [main]
  pull_request:

# Issue #209: cancel a PR's own obsolete Verify run when a new commit is
# pushed to it, without serializing unrelated PRs against each other and
# without cancelling a `main` push's post-merge Verify. `pull_request`
# events group by PR number, so successive pushes to the same PR share one
# group (and cancel-in-progress replaces the stale run); different PRs get
# different groups and stay parallel. `push` events (main only, per the
# trigger above) group by commit SHA, which is unique per push - so even
# though cancel-in-progress evaluates to false for them, there is never
# another run sharing that group to cancel, and a later merge's push (a
# different SHA) cannot cancel an earlier merge's still-running Verify.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDATION_CHECKOUT: ${{ github.workspace }}/.foundation-checkout

jobs:
  code:
    name: Verify / Code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stage-tracker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # .ai-dev-foundation/foundation-pin.json is the single source of truth
      # for the pinned Foundation SHA; scripts/foundation-checkout.mjs reads
      # the same file locally. Update it only after re-confirming the pin
      # with the Foundation bootstrap Issue (reitojike/ai-dev-foundation#17)
      # — do not assume it is still current without checking.
      - name: Read pinned Foundation SHA
        id: pin
        run: |
          sha=$(node -e "console.log(require('./.ai-dev-foundation/foundation-pin.json').sha)")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout ai-dev-foundation at pinned SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: reitojike/ai-dev-foundation
          ref: ${{ steps.pin.outputs.sha }}
          path: .foundation-checkout
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.6'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify / Code
        run: npm run verify:code

  build:
    name: Verify / Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout stage-tracker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.6'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify / Build
        run: npm run verify:build

  database:
    name: Verify / Database
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout stage-tracker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.6'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Issue #209: this runner is always a fresh GitHub-hosted VM with no
      # pre-existing Docker volumes, so `supabase start` here is always the
      # true first start for this project (never a restore of an older,
      # possibly stale local backup) and already applies every migration
      # from disk - unlike a long-lived local/agent Supabase instance, where
      # `supabase start` alone can silently resume from a prior backup
      # instead of re-applying migrations, which is why `npm run
      # verify:database` (the local/agent contract) still runs `supabase db
      # reset` explicitly. CI skips that redundant reset here. The named
      # check steps below are the exact grouped commands composed by
      # verify:database:checks, so CI keeps the same coverage while recording
      # DB guardrails before any Auth browser work.
      - name: Start local Supabase
        run: npm run verify:database:start

      - name: Verify / DB checks
        run: npm run verify:database:db-checks

      - name: Verify / Auth checks
        timeout-minutes: 5
        run: npm run verify:database:auth-checks

      # Distinguishes deadlock/concurrency failures (SQLSTATE 40P01, already
      # visible in the step above's own test output) from container
      # startup/registry/network failures by capturing container health and
      # each service's own logs. Every command is best-effort (`|| true`)
      # so a diagnostics failure cannot mask or flip the primary failure
      # above. Local Supabase only ever runs with its published local demo
      # keys/JWT secret (never real credentials), so these logs carry
      # nothing sensitive.
      #
      # Issue #259: also runs on `cancelled()` (e.g. a job hitting the
      # 20-minute timeout), not just `failure()` - a plain `if: failure()`
      # skips this step entirely for a cancelled job, which is exactly the
      # case (an Auth browser test hanging instead of failing promptly)
      # this diagnostics step is most useful for. The bounded process
      # listing below shows whether a `node`/`chrome` process is still
      # alive at that point - the leaked-process symptom Issue #259's
      # lifecycle fix targets - without broadening into general CI
      # observability.
      - name: Verify / Database diagnostics
        if: failure() || cancelled()
        run: |
          echo "::group::supabase status"
          npx supabase status || true
          echo "::endgroup::"
          echo "::group::docker ps -a"
          docker ps -a || true
          echo "::endgroup::"
          echo "::group::node/chrome process list"
          ps -eo pid,ppid,stat,etime,cmd | grep -iE '[n]ode|[c]hrome' | head -50 || true
          echo "::endgroup::"
          for container in supabase_db_stage-tracker supabase_auth_stage-tracker supabase_rest_stage-tracker supabase_kong_stage-tracker supabase_inbucket_stage-tracker supabase_pg_meta_stage-tracker; do
            echo "::group::docker logs $container (tail 300)"
            docker logs "$container" --tail 300 2>&1 || true
            echo "::endgroup::"
          done

  # Pre-merge fence for Issue #131 (root cause: #121/#124/#125 each merged a
  # migration-bearing PR without recording whether Production needed the
  # migration applied before merge, and it didn't happen before Vercel
  # auto-deployed - see docs/architecture/runtime-stack.md "デプロイ・実行
  # 経路"). This job only checks that PRs adding a supabase/migrations/**.sql
  # file record that ordering judgment in the PR body; it has no Production
  # credentials and cannot verify the migration was actually applied (see
  # "Environment Variables の所有境界" in the same doc) - actual apply and
  # its read-only drift confirmation remain an operator action via `npm run
  # supabase:migrations:drift -- --linked` (docs/runbooks/
  # gate-a-remote-environment.md).
  migration-ordering-fence:
    name: Verify / Migration Ordering Fence
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout stage-tracker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.6'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify / Migration Ordering Fence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: npm run supabase:migrations:ordering-fence
