name: Claude Code Review (manual)

# Manual, explicit-mention trigger for Claude Code review, mirrored from
# ai-dev-foundation's own workflow (see policy/core.md Review Protocol,
# Review Adapter boundary). It intentionally does NOT run automatically on
# every push. Selection Contract decides per-Task whether this trigger is
# used. Requires the CLAUDE_CODE_OAUTH_TOKEN repository secret to be
# configured before it can run.

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude-review:
    if: >
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@9cdae7f0d995e3ba7c33f226087fdf82a59cd520 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
          claude_args: |
            --max-turns 30
            --allowedTools Read,Grep,Glob
            --disallowedTools Edit,Write,MultiEdit,NotebookEdit,Bash
