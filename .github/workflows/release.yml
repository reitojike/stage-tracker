name: Release

# Production への release を一本の authority にする（Issue #387、PO 判断 D1 = C）。
#
# 以前は 2 系統が並行しており、順序が人間の記憶に依存していた。
#
#   main merge ─┬→ Vercel が push を検知して Production auto-deploy
#               └→ Supabase migration は operator が手動 apply
#
# Issue #121 / #124 / #125 は、schema-first-required という判断自体は正しく
# 認識されていたのに、3 件連続で Production migration の適用が Vercel デプロイ
# より後回しになった実例。human memory に依存した手順は recurring failure に
# なるため、この workflow が `migration -> drift 確認 -> deploy` の順序を
# 機械で保証する。
#
# **Vercel の Production auto-deploy は止めてあることが前提**
# （docs/runbooks/v2-release-pipeline-setup.md 手順 2-1）。止めないと
# migration 適用中に Vercel が先に deploy して race する。
#
# secret は GitHub Environment `production` が持ち、Deployment branches を
# `main` のみに限定してある。**この repository は agent が workflow ファイルを
# 書く**ため、PR の branch から secret を読めないことが実質的な保護になる。

on:
  # Verify が main で成功した後にだけ走る。CI が落ちている状態で deploy しない。
  workflow_run:
    workflows: ['Verify']
    types: [completed]
    branches: [main]
  # dry-run 用。既定は dry-run にして、誤操作が本番へ届かないようにする。
  workflow_dispatch:
    inputs:
      dry_run:
        description: '実際には適用・deploy せず、判断だけを表示する'
        type: boolean
        default: true

# release は同時に 1 本だけ。cancel-in-progress にしないのは、migration 適用中の
# job を途中で切ると Production が中途半端な状態になり得るため。
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release / Production
    # workflow_run の場合、**success だけでは足りない**。
    #
    # Verify は pull_request でも走る（verify.yml）。workflow_run の
    # `branches: [main]` が見るのは triggering run の head_branch なので、
    # **head branch 名が `main` の PR**（fork の main 等）で Verify が成功
    # すると、この job が Production environment の secret を持った状態で
    # 起動し、その PR の head_sha を checkout して repository 内の
    # migration/build script を実行できてしまう（PR #388 review, Codex P1）。
    #
    # したがって「push 由来であること」と「同一 repository 由来であること」を
    # 明示的に確認する。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    # deploy に GITHUB_TOKEN の書き込み権限は要らない。target の解決で
    # repository を読むだけ。
    permissions:
      contents: read
      # 手動実行時に、対象 SHA の Verify が成功しているかを確認するため。
      actions: read
    steps:
      - name: Resolve target commit
        id: target
        env:
          # workflow_run では、CI が通った commit を明示的に使う。
          # 「main の最新」ではない —— その間に別の merge が入っている可能性がある。
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ -n "$WORKFLOW_RUN_SHA" ]; then
            echo "sha=$WORKFLOW_RUN_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # operator の dashboard 作業（docs/runbooks/v2-release-pipeline-setup.md）
      # が完了するまで secret は存在しない。その間このワークフローは main への
      # push ごとに走るので、**未設定を失敗にしない**。赤い CI を常態化させると
      # 本当の失敗が埋もれる。設定が入った時点で自動的に本来の動作になる。
      - name: Check release configuration
        id: config
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          [ -z "$DB_URL" ] && missing="$missing SUPABASE_DB_URL"
          [ -z "$VERCEL_TOKEN" ] && missing="$missing VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && missing="$missing VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release is not configured yet (missing:$missing). Skipping. See docs/runbooks/v2-release-pipeline-setup.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # **手動実行でも Verify 成功を必須にする。**
      #
      # `main has moved past this target` の復旧手順として
      # workflow_dispatch を案内しているが、そのままでは
      # `workflow_run.conclusion` を確認せずに現在の main を deploy して
      # しまう。新しい commit の Verify がまだ実行中／失敗している状況で
      # operator が再実行すると、**未検証の commit が Production へ出る**
      # （PR #388 review, Codex P1。この穴は前 round で追加した復旧手順
      # 自身が作ったもの）。
      #
      # workflow_run 経由の場合は job の `if` で既に success を確認済み。
      - name: Require a successful Verify for this commit
        if: >-
          steps.config.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          conclusion=$(gh api             "repos/${{ github.repository }}/actions/workflows/verify.yml/runs?head_sha=$TARGET_SHA&status=completed"             --jq '[.workflow_runs[] | select(.event == "push")] | first | .conclusion // "none"')
          echo "Verify conclusion for $TARGET_SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "::error::No successful push-triggered Verify run for $TARGET_SHA (got: $conclusion). Refusing to deploy an unverified commit."
            exit 1
          fi

      - name: Checkout stage-tracker
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Setup pnpm
        if: steps.config.outputs.configured == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.config.outputs.configured == 'true'
        run: pnpm install --frozen-lockfile

      # pending（適用してよい）と remote-only（止めるべき）を区別する。
      # remote-only は repository に対応するファイルが無い migration が
      # Production にある状態で、その上に local を重ねてはいけない。
      - name: Plan migrations
        if: steps.config.outputs.configured == 'true'
        id: plan
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm run release:migration-plan

      - name: Apply migrations
        if: >-
          steps.config.outputs.configured == 'true' &&
          steps.plan.outputs.plan == 'apply' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pnpm run supabase:migrations:apply

      - name: Report skipped apply (dry-run)
        if: >-
          steps.config.outputs.configured == 'true' &&
          steps.plan.outputs.plan == 'apply' &&
          github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "DRY-RUN: would apply -> ${{ steps.plan.outputs.pending }}"

      # 適用後に drift 0 を確認してから deploy する。dry-run では pending が
      # 残ったままなので drift が出るのが正しく、ここは実行しない。
      # 適用後にもう一度 plan を取り、`skip`（pending も remote-only も無い）
      # であることを確認する。別のチェッカーを使わず同じコード経路で確認する
      # ので、判定の食い違いが生まれない。
      - name: Verify nothing left to apply
        id: verify_plan
        if: >-
          steps.config.outputs.configured == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pnpm run release:migration-plan
          plan=$(grep '^plan=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)
          if [ "$plan" != "skip" ]; then
            echo "::error::migrations still pending after apply (plan=$plan)"
            exit 1
          fi

      # **古い target で deploy しない。**
      #
      # Verify は SHA ごとに並行実行されるため、A の後に B が merge されても
      # B の Verify が先に完了し得る。その場合 Release B が B を deploy した
      # 後に、遅れて完了した Release A が A を deploy し、**application code
      # を巻き戻す**（B に migration が無ければ drift check も止められない）
      # （PR #388 review, Codex P1）。
      #
      # target が現在の main の先端でなければ deploy しない。より新しい
      # Release がその commit を deploy する（migration は forward-only で、
      # 既に適用済みなら plan=skip になる）。
      - name: Ensure target is still the tip of main
        id: tip
        if: >-
          steps.config.outputs.configured == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          tip=$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)
          echo "main tip: $tip"
          echo "target:   $TARGET_SHA"
          if [ "$tip" = "$TARGET_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            # **skip して success で終えない。**
            # GitHub Actions の concurrency は pending を 1 つしか保持せず、
            # 新しい run が既存の pending run を置き換える。したがって
            # 「より新しい Release が tip を deploy してくれる」という前提が
            # 成り立たず、Production が古いまま残り得る（PR #388 review）。
            #
            # 失敗させて可視化する。復旧は Actions から Release を
            # workflow_dispatch（dry_run=false）で再実行するだけでよい
            # —— その場合 target は main の tip になる。
            echo "::error::main has moved past this target ($TARGET_SHA -> $tip). Production was NOT deployed. Re-run Release via workflow_dispatch (dry_run=false) to deploy the current tip."
            exit 1
          fi

      # ここまでが success のときだけ deploy が走る。migration が失敗しても
      # drift が残っても、この step には到達しない。
      # **Deploy Hook を使わない。** Deploy Hook は branch に紐づき、その
      # branch の**最新**を build する。SHA を指定できない。したがって
      #
      #   A merge -> Verify A 成功 -> Release A が A の migration 適用
      #   その間に B merge（main = B）
      #   -> Release A が hook を叩く -> Vercel は B を deploy し得る
      #
      # となり、「A の schema を用意してから A を deploy する」という
      # この workflow の中心的な保証が「A の schema を用意して現在の main を
      # deploy する」に化ける（PR #388 review）。concurrency: release は
      # Release job 同士を直列化するだけで、main が進むことは止めない。
      #
      # Vercel CLI は **checkout した内容そのもの**を deploy するので、
      # target SHA との一致が構造的に保証される。加えて deploy 完了まで
      # 待つため、build が失敗すればこの step が失敗する（hook の 2xx は
      # 受理の意味しかなく、その後の build 失敗を拾えない）。
      - name: Deploy the verified commit to production
        if: >-
          steps.config.outputs.configured == 'true' &&
          steps.tip.outputs.current == 'true' &&
          !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_CLI_VERSION: '59.11.7'
        run: |
          # **バージョンを固定する。** この pipeline の他の依存（GitHub
          # Actions は commit SHA、supabase は lockfile）と揃える。
          # `vercel@latest` は registry の最新をその場で取得するため、
          # 悪意ある/壊れた release が `latest` に出た瞬間、**次の main
          # push で production deploy 権限を持ったまま実行される**
          # （PR #388 review, Claude）。
          pnpm dlx vercel@${VERCEL_CLI_VERSION} pull --yes --environment=production --token="$VERCEL_TOKEN"
          pnpm dlx vercel@${VERCEL_CLI_VERSION} build --prod --token="$VERCEL_TOKEN"
          url=$(pnpm dlx vercel@${VERCEL_CLI_VERSION} deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "deployed: $url"
          echo "deploy_url=$url" >> "$GITHUB_OUTPUT"

      - name: Report skipped deploy (dry-run)
        if: >-
          steps.config.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "DRY-RUN: would POST the Vercel deploy hook."

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release"
            echo ""
            echo "- target: \`${{ steps.target.outputs.sha }}\`"
            echo "- migration plan: \`${{ steps.plan.outputs.plan }}\`"
            echo "- pending: \`${{ steps.plan.outputs.pending }}\`"
            echo "- dry-run: \`${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
